[project]
name = "llmgrab"
version = "0.1.0"
description = "Observe what Claude clients (Claude Code, claude.ai) send to and receive from Anthropic"
requires-python = ">=3.12"
dependencies = [
    "mitmproxy",       # CLI grab: reverse proxy + addon; also body decompression
    "dpkt",            # web grab: pcap reading
    "cryptography",    # web grab: TLS 1.3 decryption
    "hpack",           # web grab: HTTP/2 header decoding
    "markdown-it-py",  # HTML replays
    "pandas",          # analysis
]

[project.scripts]
llmgrab = "llmgrab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmgrab"]
